<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识大赏 · 创作工作台</title>
<style>
:root{color-scheme:dark;--bg:#0b0d17;--card:#151827;--line:#35374e;--text:#f2f0fa;--muted:#b9bacd;--accent:#b5a1ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 'Microsoft YaHei',sans-serif}
main{max-width:1100px;margin:auto;padding:40px 24px 80px}header{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:16px;color:var(--muted)}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.16em;margin-top:58px}h1{font-size:clamp(32px,5vw,52px);line-height:1.2;margin:10px 0 18px}h2{font-size:22px}
.intro{color:var(--muted);max-width:700px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:36px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
label{display:block;font-weight:600;margin:12px 0 8px}textarea{font:inherit;color:var(--text);background:#0d101e;border:1px solid #656783;border-radius:10px;width:100%;min-height:120px;padding:14px;resize:vertical}
button{font:inherit;min-height:46px;padding:10px 22px;border:0;border-radius:9px;background:var(--accent);color:#171225;font-weight:700;cursor:pointer;margin-top:16px}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{opacity:.6}
.hint,.muted{color:var(--muted);font-size:14px}.project{padding:18px 0;border-top:1px solid var(--line)}.project strong{display:block;font-size:18px}.status{color:var(--accent);font-size:14px}a{color:#d2c5ff;overflow-wrap:anywhere}video{width:100%;margin-top:12px;border-radius:8px;background:#000}.sources{font-size:14px}.message{min-height:24px;color:#e9d5ff}
@media(max-width:760px){.grid{grid-template-columns:1fr}header{display:block}.eyebrow{margin-top:35px}}
</style>
</head>
<body><main>
<header><span>KNOWLEDGE MOTION / 知识动画工作台</span><span>本地作品 · 中文 · 16:9</span></header>
<div class="eyebrow">从一个问题开始</div><h1>把知识，变成画面。</h1>
<p class="intro">输入一个知识主题，系统检索资料、生成分镜并制作无旁白视频。当前是开发中的基础版本，内容和视觉效果仍需人工检查。</p>
<div class="grid"><section class="card"><h2>创建视频</h2><form id="form"><label for="topic">你想讲解什么？</label><textarea id="topic" maxlength="150" required placeholder="例如：用生活中的例子解释囚徒困境"></textarea><p class="hint">将使用本机配置的百炼 API 和指定音乐。请先确认免费额度及用完即停。</p><button id="submit">开始生成</button><p class="message" id="message" role="status" aria-live="polite"></p></form></section>
<aside class="card"><h2>生成流程</h2><p>01 · 搜集公开资料</p><p>02 · 整理讲解与分镜</p><p>03 · 制作画面并合成音乐</p><p class="hint">完成后请核对事实和资料来源。生成时间取决于模型和电脑性能。</p></aside></div>
<section style="margin-top:50px"><h2>本地作品</h2><p class="muted">作品和来源清单保存在本机。每 5 秒更新一次状态。</p><div id="projects" aria-live="polite"></div></section>
</main><script>
const form=document.getElementById('form'),message=document.getElementById('message'),list=document.getElementById('projects');
form.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit');button.disabled=true;message.textContent='正在创建任务…';try{let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:document.getElementById('topic').value})});let data=await r.json();message.textContent=data.message||data.error;await refresh()}catch(e){message.textContent='无法连接本机服务，请检查程序是否运行。'}finally{button.disabled=false}});
let lastSnapshot=''; async function refresh(){try{const response=await fetch('/api/projects');const items=await response.json();const snapshot=JSON.stringify(items);if(snapshot===lastSnapshot)return;lastSnapshot=snapshot;list.replaceChildren();if(!items.length){list.textContent='还没有作品。';return}for(const p of items){const box=document.createElement('article');box.className='project';const title=document.createElement('strong');title.textContent=p.topic;box.append(title);const status=document.createElement('span');status.className='status';status.textContent=({new:'准备中',researching:'正在查找资料',writing:'正在生成分镜',classifying:'正在选择动画形式',rendering:'正在渲染视频',complete:'已完成',revising:'正在修改',error:'生成失败'})[p.status]||p.status;box.append(status);if(p.error){const err=document.createElement('p');err.textContent=p.error;box.append(err)}if(p.revision_error){const err=document.createElement('p');err.textContent='修改失败，原视频已保留：'+p.revision_error;box.append(err)}if(p.status==='complete'){const video=document.createElement('video');video.controls=true;video.preload='none';video.src='/files/'+p.id+'/video.mp4';box.append(video);const link=document.createElement('a');link.href='/files/'+p.id+'/sources.md';link.textContent='查看来源清单';box.append(link);const edit=document.createElement('form');const label=document.createElement('label');label.textContent='用一句话修改这个作品';const input=document.createElement('textarea');input.maxLength=500;input.required=true;input.placeholder='例如：第二幕文字更简洁';label.append(input);edit.append(label);const send=document.createElement('button');send.textContent='提交修改';edit.append(send);const feedback=document.createElement('p');feedback.className='message';feedback.setAttribute('role','status');edit.append(feedback);edit.addEventListener('submit',async e=>{e.preventDefault();send.disabled=true;try{const response=await fetch('/api/revise/'+p.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:input.value})});const data=await response.json();feedback.textContent=data.message||data.error;await refresh()}catch(error){feedback.textContent='无法连接本机服务'}finally{send.disabled=false}});box.append(edit)}list.append(box)}}catch(e){list.textContent='无法读取本地作品列表。'}}refresh();setInterval(refresh,5000);
</script></body></html>
